name: jokers_trap
description: "Joker’s Trap — a single-player theatrical card duel."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.0
  go_router: ^16.2.1
  in_app_purchase: ^3.2.3
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/OFL-Cinzel.txt
    - assets/fonts/OFL-Nunito.txt
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

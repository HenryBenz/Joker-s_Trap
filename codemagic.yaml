# Подпись идёт через Code signing identities в Codemagic, как в UI-workflow.
# CERTIFICATE_PRIVATE_KEY больше не нужен.
#
# Один раз в Codemagic:
# Team settings → codemagic.yaml settings → Code signing identities
# 1. iOS certificates → Generate certificate → Apple Distribution
#    API key: JokersTrap
#    (если ключ App Store Connect уже называется иначе — подставьте это имя
#    и в integrations.app_store_connect ниже)
# 2. iOS provisioning profiles → Fetch profiles → App Store
#    для com.jokerstrap.jokersapp98
# Если Apple пишет, что Distribution-сертификатов уже 3:
# https://developer.apple.com/account/resources/certificates/list

workflows:
  ios-release:
    name: iOS App Store Connect Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: JokersTrap
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jokerstrap.jokersapp98
      vars:
        BUNDLE_ID: com.jokerstrap.jokersapp98
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" --platform IOS || echo 0)
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Using build number $NEW_BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number="$NEW_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
